name = "git-sync"
title = "Git Sync"
description = "Commits each linked todo.txt on its own and, unless it is set to commit only, pushes it, fetching changes that touch only that file."
version = "0.1.0"
api_version = 1
entry = "init.lua"
# Shells out to `git` (run_process); keeps the remote and any credential in its
# own encrypted namespace (secrets); writes the short-lived askpass helper that
# hands the credential to git (write_files); lets git use your ssh-agent for a
# document set to authenticate with it (ssh_agent); checks once a minute whether
# anything is linked (timers). All granted only once you trust this plugin.
capabilities = ["notify", "run_process", "secrets", "ssh_agent", "timers", "write_files"]
